<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Explorer</title>
<style>
  :root { --bg: #0d0d0d; --card: #1a1a2e; --accent: #e94560; --text: #eee; --muted: #888; --border: #2a2a3e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-size: 28px; color: var(--accent); }
  .stats { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
  .stat { background: var(--card); border-radius: 10px; padding: 12px 24px; text-align: center; border: 1px solid var(--border); }
  .stat-num { font-size: 22px; font-weight: bold; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .controls { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: 14px; }
  .controls input { flex: 1; min-width: 200px; }
  .controls .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .item { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .item:hover { border-color: var(--accent); }
  .item-title { font-size: 18px; font-weight: 600; cursor: pointer; color: #fff; }
  .item-title:hover { color: var(--accent); }
  .item-meta { font-size: 12px; color: var(--muted); margin: 6px 0; display: flex; gap: 12px; flex-wrap: wrap; }
  .category { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; background: rgba(233,69,96,.15); color: var(--accent); }
  .item-content { font-size: 14px; line-height: 1.6; margin: 10px 0; max-height: 120px; overflow: hidden; position: relative; }
  .item-content.expanded { max-height: none; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .file-link { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 6px; font-size: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: #5af; text-decoration: none; }
  .file-link:hover { background: rgba(255,255,255,.1); }
  .file-link .ext { text-transform: uppercase; font-weight: bold; font-size: 10px; color: var(--accent); }
  .file-link .size { color: var(--muted); font-size: 10px; }
  .comments { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .comments-toggle { color: var(--accent); cursor: pointer; font-size: 13px; user-select: none; }
  .comments-list { display: none; margin-top: 10px; }
  .comments-list.open { display: block; }
  .comment { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .comment-author { font-size: 12px; font-weight: 600; color: #5af; }
  .comment-text { font-size: 13px; line-height: 1.5; margin: 4px 0; }
  .reply { margin-left: 20px; padding: 6px 0; }
  .no-results { text-align: center; padding: 60px; color: var(--muted); }
  @media (max-width: 600px) { .stats { flex-direction: column; } }
</style>
</head>
<body>
<div class="header">
  <h1>📊 Data Explorer</h1>
  <p>Browse extracted data — search, filter, sort</p>
</div>
<div class="stats" id="stats"></div>
<div class="controls">
  <input type="text" id="search" placeholder="Search..." oninput="render()">
  <select id="categoryFilter" onchange="render()"><option value="">All</option></select>
  <select id="sortBy" onchange="render()">
    <option value="newest">Newest</option>
    <option value="oldest">Oldest</option>
    <option value="popular">Most popular</option>
  </select>
  <span class="count" id="count"></span>
</div>
<div id="items"></div>

<script>
// --- CUSTOMIZE THESE ---
const DATA_URL = 'all_items.json';
const COMMENTS_URL = 'all_comments.json';
const ATTACHMENT_DIR = 'attachments/';
const TITLE_FIELD = 'title';
const CONTENT_FIELD = 'content';
const CATEGORY_FIELD = 'category_name';
const DATE_FIELD = 'created_at';
const POPULARITY_FIELD = 'upvotes';
const COMMENTS_COUNT_FIELD = 'comment_count';
const AUTHOR_NAME_FIELD = d => (d.author?.first_name || '') + ' ' + (d.author?.last_name || '');
const FILES_FIELD = 'downloaded_files';
const COMMENT_TEXT_FIELD = 'content';
const COMMENT_AUTHOR_FIELD = c => (c.author?.first_name || '') + ' ' + (c.author?.last_name || '');

let items = [];
let commentsMap = {};

async function init() {
  try {
    const [r1, r2] = await Promise.all([fetch(DATA_URL), fetch(COMMENTS_URL)]);
    const data = await r1.json();
    const commentsData = await r2.json();
    items = data.posts || data.items || data;
    for (const c of (commentsData.comments || [])) {
      const pid = c.post_id;
      if (!commentsMap[pid]) commentsMap[pid] = [];
      commentsMap[pid].push(c);
    }
    const cats = new Set();
    items.forEach(p => { if (p[CATEGORY_FIELD]) cats.add(p[CATEGORY_FIELD]); });
    const sel = document.getElementById('categoryFilter');
    [...cats].sort().forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
    render();
  } catch(e) { document.getElementById('items').innerHTML = '<div class="no-results">Error: ' + e.message + '</div>'; }
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const sort = document.getElementById('sortBy').value;
  let filtered = items.filter(p => {
    if (cat && p[CATEGORY_FIELD] !== cat) return false;
    if (q) {
      const t = (p[TITLE_FIELD] || '').toLowerCase();
      const c = (p[CONTENT_FIELD] || '').toLowerCase();
      const a = AUTHOR_NAME_FIELD(p).toLowerCase();
      return t.includes(q) || c.includes(q) || a.includes(q);
    }
    return true;
  });
  filtered.sort((a,b) => {
    if (sort === 'newest') return (b[DATE_FIELD]||'').localeCompare(a[DATE_FIELD]||'');
    if (sort === 'oldest') return (a[DATE_FIELD]||'').localeCompare(b[DATE_FIELD]||'');
    if (sort === 'popular') return (b[POPULARITY_FIELD]||0) - (a[POPULARITY_FIELD]||0);
    return 0;
  });
  document.getElementById('count').textContent = filtered.length + ' items';
  document.getElementById('items').innerHTML = filtered.map(p => {
    const cm = commentsMap[p.id] || [];
    const files = p[FILES_FIELD] || [];
    return '<div class="item">' +
      '<div class="item-title">' + esc(p[TITLE_FIELD] || '(no title)') + '</div>' +
      '<div class="item-meta"><span class="category">' + esc(p[CATEGORY_FIELD] || '') + '</span>' +
      ' <span>👤 ' + esc(AUTHOR_NAME_FIELD(p)) + '</span>' +
      ' <span>📅 ' + fmtDate(p[DATE_FIELD]) + '</span>' +
      ' <span>👍 ' + (p[POPULARITY_FIELD]||0) + '</span>' +
      ' <span>💬 ' + (p[COMMENTS_COUNT_FIELD]||0) + '</span></div>' +
      '<div class="item-content" onclick="this.classList.toggle(\'expanded\')">' + esc(p[CONTENT_FIELD]||'') + '</div>' +
      (files.length ? '<div class="files">' + files.map(f =>
        '<a class="file-link" href="' + ATTACHMENT_DIR + encodeURIComponent(f.file_name) + '" target="_blank">' +
        '<span class="ext">' + (f.file_name.includes('.') ? f.file_name.split('.').pop() : '?') + '</span> ' +
        esc(f.file_name) + ' <span class="size">' + fmtSize(f.file_size) + '</span></a>'
      ).join('') + '</div>' : '') +
      (cm.length ? '<div class="comments"><div class="comments-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\');this.textContent=this.nextElementSibling.classList.contains(\'open\')?\'\u25b2 hide comments\':\'\u25bc \'+cm.length+\' comments\';}">\u25bc ' + cm.length + ' comments</div><div class="comments-list">' +
        cm.map(c => '<div class="comment"><span class="comment-author">' + esc(COMMENT_AUTHOR_FIELD(c)) + '</span> ' + esc(c[COMMENT_TEXT_FIELD]||'') +
          (c.replies?.length ? c.replies.map(r =>
            '<div class="reply"><span class="comment-author">' + esc(COMMENT_AUTHOR_FIELD(r)) + '</span> ' + esc(r[COMMENT_TEXT_FIELD]||'') + '</div>'
          ).join('') : '') + '</div>'
        ).join('') + '</div></div>' : '') +
    '</div>';
  }).join('') || '<div class="no-results">No results</div>';
}

function fmtDate(d) { if (!d) return ''; const dt = new Date(d); return dt.toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}); }
function fmtSize(b) { if (!b) return ''; if (b<1024) return b+'B'; if (b<1048576) return (b/1024).toFixed(0)+'KB'; return (b/1048576).toFixed(1)+'MB'; }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
init();
</script>
</body>
</html>
